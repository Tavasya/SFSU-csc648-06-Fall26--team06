# Runs the unit tests with coverage on every pull request into develop or main,
# on every push/merge to develop or main, and on demand from the Actions tab. The job fails if any
# test fails, or if function coverage drops below 90% or line coverage below 50%.
name: Unit tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node --test with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee test-output.txt

      - name: Add coverage report to the job summary
        if: always()
        run: |
          {
            echo "## Unit test results"
            echo '```'
            grep -E '^ℹ (tests|pass|fail)' test-output.txt || true
            echo '```'
            echo "## Coverage (functions >= 90%, lines >= 50%)"
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' test-output.txt | sed 's/^ℹ //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
